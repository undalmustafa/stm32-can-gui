name: Python tests

on:
  push:
  pull_request:

jobs:
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for test_file in python/tests/test_*.py; do
            python "$test_file"
          done
