name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol generation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --requirement protocol/requirements.txt

      - name: Verify generated protocol files
        shell: bash
        run: |
          set -euo pipefail
          python protocol/generate_c.py
          python protocol/generate_python.py
          git diff --exit-code -- \
            Core/Inc/can_protocol_generated.h \
            python/can_protocol_generated.py

  c-tests:
    name: Host C tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and run Unity tests
        run: make -C tests test

  static-analysis:
    name: Cppcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cppcheck

      - name: Run static analysis quality gate
        run: make static-analysis

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-${{ github.sha }}
          path: build/static-analysis/
          if-no-files-found: error
          retention-days: 14

  watchdog-tests:
    name: Watchdog host tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run watchdog policy tests
        run: python tests/host/run_watchdog_tests.py

  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test stack usage analyzer
        run: make -C tests test-stack-usage

      - name: Install GNU Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Build debug firmware
        run: make CONFIG=debug --jobs=2

      - name: Verify debug fault-injection hooks
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-nm build/debug/can_gui.elf \
            | grep ' App_Watchdog_SetTestInhibit$'
          arm-none-eabi-nm build/debug/can_gui.elf \
            | grep ' App_Watchdog_SetTestSuppressHeartbeatMask$'

      - name: Build release firmware
        run: make CONFIG=release --jobs=2

      - name: Verify release excludes fault-injection hooks
        shell: bash
        run: |
          set -euo pipefail
          if arm-none-eabi-nm build/release/can_gui.elf \
            | grep ' App_Watchdog_SetTest' > /dev/null; then
            echo 'Release ELF contains watchdog fault-injection hooks' >&2
            exit 1
          fi

      - name: Verify release stack budget
        run: make CONFIG=release stack-report

      - name: Upload stack usage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-usage-${{ github.sha }}
          path: |
            build/release/stack-usage.txt
            build/release/stack-usage.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/release/can_gui.elf
            build/release/can_gui.hex
            build/release/can_gui.bin
            build/release/can_gui.map
          if-no-files-found: error
          retention-days: 14

  gui:
    name: GUI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m compileall -q python/can_gui.py python/can_gui_app python/tests

      - name: Run GUI regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in python/tests/test_gui_*.py; do
            python "$test_file"
          done
