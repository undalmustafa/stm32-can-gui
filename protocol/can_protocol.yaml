# =============================================================================
# CAN Protocol Definition — SINGLE SOURCE OF TRUTH
# =============================================================================
#
# This file defines every protocol constant shared between the STM32 firmware
# and the Python GUI.  Generators read this YAML and produce:
#
#   protocol/generate_c.py      →  Core/Inc/can_protocol_generated.h
#   protocol/generate_python.py →  python/can_protocol_generated.py
#
# RULES:
#   • Never hard-code a CAN ID, command code, or status code in C or Python.
#   • Add new protocol elements HERE, then re-run the generators.
#   • Numeric values are part of the wire contract — never change them.
#   • New entries must be appended; do not reorder existing entries.
# =============================================================================

protocol:
  name: can_gui
  version: 1
  payload_size: 8
  byte_order: little_endian

# ---------------------------------------------------------------------------
# CAN Identifiers
# ---------------------------------------------------------------------------
identifiers:
  gui_command:
    id: 0x1894AABB
    type: extended
    direction: gui_to_mcu
    description: "All GUI commands"

  rtc_status:
    id: 0x0551
    type: standard
    direction: mcu_to_gui
    description: "RTC operation status"

  rtc_time:
    id: 0x0556
    type: standard
    direction: mcu_to_gui
    description: "RTC time and calendar"

  system_status:
    id: 0x0557
    type: standard
    direction: mcu_to_gui
    description: "Slot and LED state"

  rtc_alarm_event:
    id: 0x0558
    type: standard
    direction: mcu_to_gui
    description: "RTC alarm event notification"

  pwm_status:
    id: 0x055C
    type: standard
    direction: mcu_to_gui
    description: "PWM output status"

  input_capture_status:
    id: 0x055D
    type: standard
    direction: mcu_to_gui
    description: "Input capture measurement with estimated edge count"

  pwm_self_test_status:
    id: 0x055E
    type: standard
    direction: mcu_to_gui
    description: "PWM built-in self-test state and current target"

  pwm_self_test_result:
    id: 0x055F
    type: standard
    direction: mcu_to_gui
    description: "PWM built-in self-test point result"

  log_response:
    id: 0x055A
    type: standard
    direction: mcu_to_gui
    description: "STM32 event-log response fragments"

  log_heartbeat:
    id: 0x055B
    type: standard
    direction: mcu_to_gui
    description: "STM32 event-log heartbeat"

  command_ack:
    id: 0x0550
    type: standard
    direction: mcu_to_gui
    description: "Reliable command acknowledgement"

  tic12400_status:
    id: 0x0552
    type: standard
    direction: mcu_to_gui
    description: "TIC12400 device and service status"

  tic12400_adc:
    id: 0x0553
    type: standard
    direction: mcu_to_gui
    description: "Segmented TIC12400 raw ADC snapshot"

  tic12400_switch_state:
    id: 0x0554
    type: standard
    direction: mcu_to_gui
    description: "Debounced TIC12400 open/closed switch state"

command_transport:
  sequence_mask: 0x000000FF
  session_mask: 0x0000FF00
  session_shift: 8
  identifier_mask: 0x1FFF0000

# ---------------------------------------------------------------------------
# Command Codes (byte 0 of GUI→MCU payload)
# ---------------------------------------------------------------------------
commands:
  set_slot_1:
    code: 0x01
    description: "Configure transmit slot 1"

  set_slot_2:
    code: 0x02
    description: "Configure transmit slot 2"

  led_control:
    code: 0x10
    description: "Set LED 1 or LED 2"

  start_slot_1_counter:
    code: 0x11
    description: "Start slot 1 counter"

  start_slot_2_counter:
    code: 0x12
    description: "Start slot 2 counter"

  rtc_set_time:
    code: 0x20
    description: "Set time while retaining calendar data"

  rtc_set_datetime:
    code: 0x21
    description: "Set the complete RTC calendar"

  rtc_set_alarm:
    code: 0x22
    description: "Set RTC alarm configuration"

  pwm_set:
    code: 0x40
    description: "Set PWM output frequency and duty cycle"

  pwm_self_test:
    code: 0x41
    description: "Start or cancel the PWM built-in self-test"

  log_get_info:
    code: 0x30
    description: "Request STM32 event-log metadata"

  log_read_sequence:
    code: 0x31
    description: "Request one STM32 event-log record by sequence"

  session_start:
    code: 0x7E
    description: "Start or replace the reliable command session"

command_ack_status_codes:
  accepted:
    code: 0x00
  duplicate:
    code: 0x01
  invalid_payload:
    code: 0x02
  unknown_command:
    code: 0x03
  access_denied:
    code: 0x04
  replay_rejected:
    code: 0x05
  session_required:
    code: 0x06
  protocol_mismatch:
    code: 0x07

command_ack_flags:
  executed:
    bit: 0
  access_open:
    bit: 1
  session_started:
    bit: 2

# ---------------------------------------------------------------------------
# RTC Status Codes (byte 0 of 0x551 telemetry)
#
# 0xAx = success / info
# 0xEx = error / warning
# 0xFx = extended error
# ---------------------------------------------------------------------------
rtc_status_codes:
  # ---- Success / Info (0xAx) ----
  init_ok:
    code: 0xA1
    severity: info
    mnemonic: "INIT_OK"
    description: "PCA2131 address probe acknowledged"

  write_verify_ok:
    code: 0xA2
    severity: info
    mnemonic: "WRITE_VERIFY_OK"
    description: "Calendar write verified by readback"

  reconnected:
    code: 0xA3
    severity: info
    mnemonic: "LINK_RECOVERED"
    description: "I2C communication restored"

  alarm_write_verify_ok:
    code: 0xA4
    severity: info
    mnemonic: "ALARM_WRITE_VERIFY_OK"
    description: "Alarm configuration verified by readback"

  # ---- Errors / Warnings (0xEx) ----
  init_failed:
    code: 0xE1
    severity: fault
    mnemonic: "INIT_FAILED"
    description: "PCA2131 not detected during initialization"
    is_communication_fault: true

  read_failed:
    code: 0xE2
    severity: fault
    mnemonic: "READ_FAILED"
    description: "RTC register read failed"
    is_communication_fault: true

  invalid_datetime:
    code: 0xE4
    severity: warning
    mnemonic: "INVALID_DATETIME"
    description: "Date/time parameters rejected"

  control_read_failed:
    code: 0xE5
    severity: fault
    mnemonic: "CONTROL_READ_FAILED"
    description: "Control_1 register read failed"
    is_communication_fault: true

  stop_write_failed:
    code: 0xE6
    severity: fault
    mnemonic: "STOP_ASSERT_FAILED"
    description: "STOP bit could not be asserted"
    is_communication_fault: true

  cpr_write_failed:
    code: 0xE7
    severity: fault
    mnemonic: "PRESCALER_RESET_FAILED"
    description: "Prescaler reset command failed"
    is_communication_fault: true

  calendar_write_failed:
    code: 0xE8
    severity: fault
    mnemonic: "CALENDAR_WRITE_FAILED"
    description: "Calendar register write failed"
    is_communication_fault: true

  start_write_failed:
    code: 0xE9
    severity: fault
    mnemonic: "STOP_RELEASE_FAILED"
    description: "STOP bit could not be released"
    is_communication_fault: true

  recovery_failed:
    code: 0xEA
    severity: fault
    mnemonic: "RECOVERY_FAILED"
    description: "RTC write recovery failed"
    is_communication_fault: true

  busy:
    code: 0xEB
    severity: warning
    mnemonic: "BUSY"
    description: "RTC operation already in progress"

  alarm_not_ready:
    code: 0xEC
    severity: warning
    mnemonic: "ALARM_NOT_READY"
    description: "RTC is not ready for alarm configuration"

  invalid_alarm_config:
    code: 0xED
    severity: warning
    mnemonic: "INVALID_ALARM_CONFIG"
    description: "Alarm configuration was rejected"

  alarm_write_failed:
    code: 0xEE
    severity: fault
    mnemonic: "ALARM_WRITE_FAILED"
    description: "Alarm register write failed"

  alarm_readback_failed:
    code: 0xEF
    severity: fault
    mnemonic: "ALARM_READBACK_FAILED"
    description: "Alarm register readback failed"

  alarm_verify_mismatch:
    code: 0xF0
    severity: fault
    mnemonic: "ALARM_VERIFY_MISMATCH"
    description: "Alarm write/readback mismatch"

  alarm_flag_clear_failed:
    code: 0xF1
    severity: fault
    mnemonic: "ALARM_FLAG_CLEAR_FAILED"
    description: "Previous alarm flag could not be cleared"

# ---------------------------------------------------------------------------
# RTC Alarm Event Codes (byte 0 of 0x558 telemetry)
# ---------------------------------------------------------------------------
rtc_alarm_event_codes:
  triggered:
    code: 0x01
    description: "Alarm condition matched"

# ---------------------------------------------------------------------------
# Slot Configuration Flags (byte 1 of SET_SLOT commands)
# ---------------------------------------------------------------------------
slot_flags:
  enable:
    bit: 0
    description: "Slot enable"

  extended_id:
    bit: 1
    description: "Use 29-bit extended CAN identifier"

# ---------------------------------------------------------------------------
# System Status Control-Policy Flags (bytes 5-7 of 0x557)
# ---------------------------------------------------------------------------
system_status_request_flags:
  slot_1:
    bit: 0
  slot_2:
    bit: 1
  led_1:
    bit: 2
  led_2:
    bit: 3
  pwm:
    bit: 4

system_status_physical_flags:
  data_valid:
    bit: 0
  in0_closed:
    bit: 1
  in1_closed:
    bit: 2
  in2_closed:
    bit: 3
  in3_closed:
    bit: 4

system_status_override_flags:
  slot_1_blocked:
    bit: 0
  slot_2_blocked:
    bit: 1
  led_1_overridden:
    bit: 2
  pwm_blocked:
    bit: 4

pwm_status_control_flags:
  requested:
    bit: 0
  physical_permitted:
    bit: 1
  blocked:
    bit: 2
  switch_data_valid:
    bit: 3

# ---------------------------------------------------------------------------
# Alarm Enable Flags (byte 1 of RTC_SET_ALARM command)
# ---------------------------------------------------------------------------
alarm_enable_flags:
  second:
    bit: 0
    description: "Match second field"

  minute:
    bit: 1
    description: "Match minute field"

  hour:
    bit: 2
    description: "Match hour field"

  day:
    bit: 3
    description: "Match day field"

  weekday:
    bit: 4
    description: "Match weekday field"

# ---------------------------------------------------------------------------
# Alarm Event Flags (byte 1 of 0x558 telemetry, bit field)
# ---------------------------------------------------------------------------
alarm_event_flags:
  af:
    bit: 0
    description: "Alarm Flag (AF) — hardware alarm matched"

  aie:
    bit: 1
    description: "Alarm Interrupt Enable (AIE)"

  config_ok:
    bit: 2
    description: "Alarm configuration valid"

# ---------------------------------------------------------------------------
# TIC12400 Telemetry
# ---------------------------------------------------------------------------
tic12400_transport:
  adc_channel_count: 24
  adc_codes_per_frame: 3
  adc_group_count: 8
  adc_code_max: 1023
  switch_closed_max_adc_code: 512
  switch_debounce_samples: 3

tic12400_switch_flags:
  data_valid:
    bit: 0

tic12400_status_flags:
  online:
    bit: 0
  configuration_valid:
    bit: 1
  crc_complete:
    bit: 2
  monitoring:
    bit: 3
  adc_characterization:
    bit: 4
  por_observed:
    bit: 5
  service_fault:
    bit: 6

tic12400_transaction_flags:
  spi_fail:
    bit: 0
  parity_fail:
    bit: 1
  switch_state_change:
    bit: 2
  supply_threshold:
    bit: 3
  temperature:
    bit: 4
  other_interrupt:
    bit: 5
  power_on_reset:
    bit: 6

tic12400_result_codes:
  ok:
    code: 0x00
  invalid_argument:
    code: 0x01
  invalid_address:
    code: 0x02
  hal_error:
    code: 0x03
  response_parity_error:
    code: 0x04
  device_spi_error:
    code: 0x05
  device_parity_error:
    code: 0x06
  device_id_mismatch:
    code: 0x07
  invalid_data:
    code: 0x08
  register_verify_mismatch:
    code: 0x09
  crc_timeout:
    code: 0x0A
  crc_completion_missing:
    code: 0x0B
  unknown:
    code: 0xFF
