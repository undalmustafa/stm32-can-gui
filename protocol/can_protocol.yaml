# =============================================================================
# CAN Protocol Definition — SINGLE SOURCE OF TRUTH
# =============================================================================
#
# This file defines every protocol constant shared between the STM32 firmware
# and the Python GUI.  Generators read this YAML and produce:
#
#   protocol/generate_c.py      →  Core/Inc/can_protocol_generated.h
#   protocol/generate_python.py →  python/can_protocol_generated.py
#
# RULES:
#   • Never hard-code a CAN ID, command code, or status code in C or Python.
#   • Add new protocol elements HERE, then re-run the generators.
#   • Numeric values are part of the wire contract — never change them.
#   • New entries must be appended; do not reorder existing entries.
# =============================================================================

protocol:
  name: can_gui
  version: 2
  payload_size: 8
  byte_order: little_endian

# ---------------------------------------------------------------------------
# CAN Identifiers
# ---------------------------------------------------------------------------
identifiers:
  gui_command:
    id: 0x1894AABB
    type: extended
    direction: gui_to_mcu
    description: "Fixed identifier for all multiplexed GUI commands"

  rtc_status:
    id: 0x0551
    type: standard
    direction: mcu_to_gui
    description: "RTC operation status"

  rtc_time:
    id: 0x0556
    type: standard
    direction: mcu_to_gui
    description: "RTC time and calendar"

  system_status:
    id: 0x0557
    type: standard
    direction: mcu_to_gui
    description: "Slot and LED state"

  rtc_alarm_event:
    id: 0x0558
    type: standard
    direction: mcu_to_gui
    description: "RTC alarm event notification"

  pwm_status:
    id: 0x055C
    type: standard
    direction: mcu_to_gui
    description: "PWM output status"

  input_capture_status:
    id: 0x055D
    type: standard
    direction: mcu_to_gui
    description: "Input capture measurement with estimated edge count"

  pwm_self_test_status:
    id: 0x055E
    type: standard
    direction: mcu_to_gui
    description: "PWM built-in self-test state and current target"

  pwm_self_test_result:
    id: 0x055F
    type: standard
    direction: mcu_to_gui
    description: "PWM built-in self-test point result"

  log_response:
    id: 0x055A
    type: standard
    direction: mcu_to_gui
    description: "STM32 event-log response fragments"

  log_heartbeat:
    id: 0x055B
    type: standard
    direction: mcu_to_gui
    description: "STM32 event-log heartbeat"

  command_ack:
    id: 0x0550
    type: standard
    direction: mcu_to_gui
    description: "Command execution acknowledgement"

  tic12400_status:
    id: 0x0552
    type: standard
    direction: mcu_to_gui
    description: "TIC12400 device and service status"

  tic12400_switch_state:
    id: 0x0554
    type: standard
    direction: mcu_to_gui
    description: "Debounced TIC12400 open/closed switch state"

  tic12400_profile:
    id: 0x0555
    type: standard
    direction: mcu_to_gui
    description: "Applied TIC12400 switch-polarity profile"

  can_rx_health:
    id: 0x0560
    type: standard
    direction: mcu_to_gui
    description: "MCU FDCAN RX FIFO pressure and loss telemetry"

  timing_service:
    id: 0x0561
    type: standard
    direction: mcu_to_gui
    description: "DWT service execution timing telemetry"

  timing_ack_latency:
    id: 0x0562
    type: standard
    direction: mcu_to_gui
    description: "Command RX-to-ACK enqueue latency percentiles"

log_transport:
  version: 1
  record_size: 32
  ram_capacity: &log_ram_capacity 64
  record_magic: 0x4C4F4731
  commit_marker: 0xA55A
  fragment_data_size: 7
  info_wire_size: 18
  info_fragment_base: 0x70
  info_fragment_count: 3
  record_fragment_base: 0x80
  record_fragment_count: 5
  error_frame: 0xF0

log_heartbeat_flags:
  ready:
    bit: 0
  overwrite:
    bit: 1

log_error_codes:
  sequence_not_found:
    code: 0x01

timing_service_codes:
  main_loop:
    code: 0
  tic12400_probe:
    code: 1
  control:
    code: 2
  rtc:
    code: 3
  input_capture:
    code: 4
  can_app:
    code: 5
  tic12400_can:
    code: 6
  watchdog:
    code: 7

command_transport:
  identifier_mode: fixed
  serialized_requests: true
  ack_request_token:
    byte: 2
    algorithm: crc8_sae_j1850
    description: "CRC-8 token over all eight request payload bytes"

# ---------------------------------------------------------------------------
# Command Codes (byte 0 of GUI→MCU payload)
# ---------------------------------------------------------------------------
commands:
  set_slot_1:
    code: 0x01
    description: "Configure transmit slot 1"

  set_slot_2:
    code: 0x02
    description: "Configure transmit slot 2"

  led_control:
    code: 0x10
    description: "Set LED 1 or LED 2"

  start_slot_1_counter:
    code: 0x11
    description: "Start slot 1 counter"

  start_slot_2_counter:
    code: 0x12
    description: "Start slot 2 counter"

  rtc_set_time:
    code: 0x20
    description: "Set time while retaining calendar data"

  rtc_set_datetime:
    code: 0x21
    description: "Set the complete RTC calendar"

  rtc_set_alarm:
    code: 0x22
    description: "Set RTC alarm configuration"

  pwm_set:
    code: 0x40
    description: "Set PWM output frequency and duty cycle"

  pwm_self_test:
    code: 0x41
    description: "Start or cancel the PWM built-in self-test"

  log_get_info:
    code: 0x30
    description: "Request STM32 event-log metadata"

  log_read_sequence:
    code: 0x31
    description: "Request one STM32 event-log record by sequence"

  tic12400_set_polarity:
    code: 0x50
    description: "Set IN0-IN9 battery/ground switch polarity mask"

command_ack_status_codes:
  accepted:
    code: 0x00
  invalid_payload:
    code: 0x02
  unknown_command:
    code: 0x03
  access_denied:
    code: 0x04

command_ack_flags:
  executed:
    bit: 0
  access_open:
    bit: 1

# ---------------------------------------------------------------------------
# RTC Status Codes (byte 0 of 0x551 telemetry)
#
# 0xAx = success / info
# 0xEx = error / warning
# 0xFx = extended error
# ---------------------------------------------------------------------------
rtc_status_codes:
  # ---- Success / Info (0xAx) ----
  init_ok:
    code: 0xA1
    severity: info
    mnemonic: "INIT_OK"
    description: "PCA2131 address probe acknowledged"

  write_verify_ok:
    code: 0xA2
    severity: info
    mnemonic: "WRITE_VERIFY_OK"
    description: "Calendar write verified by readback"

  reconnected:
    code: 0xA3
    severity: info
    mnemonic: "LINK_RECOVERED"
    description: "I2C communication restored"

  alarm_write_verify_ok:
    code: 0xA4
    severity: info
    mnemonic: "ALARM_WRITE_VERIFY_OK"
    description: "Alarm configuration verified by readback"

  # ---- Errors / Warnings (0xEx) ----
  init_failed:
    code: 0xE1
    severity: fault
    mnemonic: "INIT_FAILED"
    description: "PCA2131 not detected during initialization"
    is_communication_fault: true

  read_failed:
    code: 0xE2
    severity: fault
    mnemonic: "READ_FAILED"
    description: "RTC register read failed"
    is_communication_fault: true

  invalid_datetime:
    code: 0xE4
    severity: warning
    mnemonic: "INVALID_DATETIME"
    description: "Date/time parameters rejected"

  control_read_failed:
    code: 0xE5
    severity: fault
    mnemonic: "CONTROL_READ_FAILED"
    description: "Control_1 register read failed"
    is_communication_fault: true

  stop_write_failed:
    code: 0xE6
    severity: fault
    mnemonic: "STOP_ASSERT_FAILED"
    description: "STOP bit could not be asserted"
    is_communication_fault: true

  cpr_write_failed:
    code: 0xE7
    severity: fault
    mnemonic: "PRESCALER_RESET_FAILED"
    description: "Prescaler reset command failed"
    is_communication_fault: true

  calendar_write_failed:
    code: 0xE8
    severity: fault
    mnemonic: "CALENDAR_WRITE_FAILED"
    description: "Calendar register write failed"
    is_communication_fault: true

  start_write_failed:
    code: 0xE9
    severity: fault
    mnemonic: "STOP_RELEASE_FAILED"
    description: "STOP bit could not be released"
    is_communication_fault: true

  recovery_failed:
    code: 0xEA
    severity: fault
    mnemonic: "RECOVERY_FAILED"
    description: "RTC write recovery failed"
    is_communication_fault: true

  busy:
    code: 0xEB
    severity: warning
    mnemonic: "BUSY"
    description: "RTC operation already in progress"

  alarm_not_ready:
    code: 0xEC
    severity: warning
    mnemonic: "ALARM_NOT_READY"
    description: "RTC is not ready for alarm configuration"

  invalid_alarm_config:
    code: 0xED
    severity: warning
    mnemonic: "INVALID_ALARM_CONFIG"
    description: "Alarm configuration was rejected"

  alarm_write_failed:
    code: 0xEE
    severity: fault
    mnemonic: "ALARM_WRITE_FAILED"
    description: "Alarm register write failed"

  alarm_readback_failed:
    code: 0xEF
    severity: fault
    mnemonic: "ALARM_READBACK_FAILED"
    description: "Alarm register readback failed"

  alarm_verify_mismatch:
    code: 0xF0
    severity: fault
    mnemonic: "ALARM_VERIFY_MISMATCH"
    description: "Alarm write/readback mismatch"

  alarm_flag_clear_failed:
    code: 0xF1
    severity: fault
    mnemonic: "ALARM_FLAG_CLEAR_FAILED"
    description: "Previous alarm flag could not be cleared"

  write_verify_mismatch:
    code: 0xF2
    severity: fault
    mnemonic: "WRITE_VERIFY_MISMATCH"
    description: "Calendar write/readback mismatch"

# ---------------------------------------------------------------------------
# RTC Alarm Event Codes (byte 0 of 0x558 telemetry)
# ---------------------------------------------------------------------------
rtc_alarm_event_codes:
  triggered:
    code: 0x01
    description: "Alarm condition matched"

# ---------------------------------------------------------------------------
# Slot Configuration Flags (byte 1 of SET_SLOT commands)
# ---------------------------------------------------------------------------
slot_flags:
  enable:
    bit: 0
    description: "Slot enable"

  extended_id:
    bit: 1
    description: "Use 29-bit extended CAN identifier"

# ---------------------------------------------------------------------------
# System Status Control-Policy Flags (bytes 5-7 of 0x557)
# ---------------------------------------------------------------------------
system_status_request_flags:
  slot_1:
    bit: 0
  slot_2:
    bit: 1
  led_1:
    bit: 2
  led_2:
    bit: 3
  pwm:
    bit: 4

system_status_physical_flags:
  data_valid:
    bit: 0
  in0_closed:
    bit: 1
  in1_closed:
    bit: 2
  in2_closed:
    bit: 3
  in3_closed:
    bit: 4

system_status_override_flags:
  slot_1_blocked:
    bit: 0
  slot_2_blocked:
    bit: 1
  led_1_overridden:
    bit: 2
  pwm_blocked:
    bit: 4

can_rx_health_flags:
  watermark_seen:
    bit: 0
  fifo_full_seen:
    bit: 1
  message_lost:
    bit: 2
  budget_exhausted:
    bit: 3
  hal_error:
    bit: 4

timing_service_flags:
  enabled:
    bit: 0
  current_overrun:
    bit: 1
  overrun_latched:
    bit: 2

pwm_status_control_flags:
  requested:
    bit: 0
  physical_permitted:
    bit: 1
  blocked:
    bit: 2
  switch_data_valid:
    bit: 3

pwm_self_test_state_codes:
  idle:
    code: 0
  running:
    code: 1
  passed:
    code: 2
  failed:
    code: 3
  cancelled:
    code: 4
  error:
    code: 5
    display_name: "Firmware error"

# ---------------------------------------------------------------------------
# Alarm Enable Flags (byte 1 of RTC_SET_ALARM command)
# ---------------------------------------------------------------------------
alarm_enable_flags:
  second:
    bit: 0
    description: "Match second field"

  minute:
    bit: 1
    description: "Match minute field"

  hour:
    bit: 2
    description: "Match hour field"

  day:
    bit: 3
    description: "Match day field"

  weekday:
    bit: 4
    description: "Match weekday field"

# ---------------------------------------------------------------------------
# Alarm Event Flags (byte 1 of 0x558 telemetry, bit field)
# ---------------------------------------------------------------------------
alarm_event_flags:
  af:
    bit: 0
    description: "Alarm Flag (AF) — hardware alarm matched"

  aie:
    bit: 1
    description: "Alarm Interrupt Enable (AIE)"

  config_ok:
    bit: 2
    description: "Alarm configuration valid"

# ---------------------------------------------------------------------------
# TIC12400 Telemetry
# ---------------------------------------------------------------------------
tic12400_transport:
  channel_count: 24
  battery_capable_mask: 1023

tic12400_switch_flags:
  data_valid:
    bit: 0

tic12400_profile_flags:
  configuration_valid:
    bit: 0

tic12400_status_flags:
  online:
    bit: 0
  configuration_valid:
    bit: 1
  crc_complete:
    bit: 2
  monitoring:
    bit: 3
  por_observed:
    bit: 5
  service_fault:
    bit: 6

tic12400_transaction_flags:
  spi_fail:
    bit: 0
  parity_fail:
    bit: 1
  switch_state_change:
    bit: 2
  supply_threshold:
    bit: 3
  temperature:
    bit: 4
  other_interrupt:
    bit: 5
  power_on_reset:
    bit: 6

tic12400_result_codes:
  ok:
    code: 0x00
  invalid_argument:
    code: 0x01
  invalid_address:
    code: 0x02
  hal_error:
    code: 0x03
  response_parity_error:
    code: 0x04
  device_spi_error:
    code: 0x05
  device_parity_error:
    code: 0x06
  device_id_mismatch:
    code: 0x07
  invalid_data:
    code: 0x08
  register_verify_mismatch:
    code: 0x09
  crc_timeout:
    code: 0x0A
  crc_completion_missing:
    code: 0x0B
  unknown:
    code: 0xFF

# ---------------------------------------------------------------------------
# DBC Signal Definitions
#
# Frames omitted here retain the lossless PayloadByte0..7 baseline until their
# wire layouts are promoted to product-level signals.
# ---------------------------------------------------------------------------
dbc_boolean_values:
  0: "False"
  1: "True"

dbc_signals:
  rtc_status:
    - name: StatusCode
      start_bit: 0
      length: 8
      value_source: rtc_status_codes
      description: "RTC operation result"
    - name: HalStatus
      start_bit: 8
      length: 8
      description: "STM32 HAL operation status"
    - name: HalError
      start_bit: 16
      length: 32
      description: "STM32 HAL I2C error bitmap"
    - name: Reserved
      start_bit: 48
      length: 16
      description: "Reserved; transmit zero"

  rtc_time:
    - name: Hour
      start_bit: 0
      length: 8
      maximum: 23
      unit: "h"
    - name: Minute
      start_bit: 8
      length: 8
      maximum: 59
      unit: "min"
    - name: Second
      start_bit: 16
      length: 8
      maximum: 59
      unit: "s"
    - name: Hundredth
      start_bit: 24
      length: 8
      maximum: 99
      unit: "10 ms"
      description: "Hundredths of a second"
    - name: Day
      start_bit: 32
      length: 8
      minimum: 1
      maximum: 31
    - name: Month
      start_bit: 40
      length: 8
      minimum: 1
      maximum: 12
    - name: Year
      start_bit: 48
      length: 8
      maximum: 99
      description: "Year offset from 2000"
    - name: Weekday
      start_bit: 56
      length: 3
      maximum: 6
      description: "PCA2131 weekday index; zero denotes Sunday"
    - name: TimeReserved
      start_bit: 59
      length: 2
      description: "Reserved time flag bits; transmit zero"
    - name: CalendarValid
      start_bit: 61
      length: 1
      value_source: dbc_boolean_values
      description: "Calendar fields passed validation"
    - name: Ready
      start_bit: 62
      length: 1
      value_source: dbc_boolean_values
      description: "RTC service is ready"
    - name: OscillatorStopFlag
      start_bit: 63
      length: 1
      value_source: dbc_boolean_values
      description: "PCA2131 oscillator-stop flag is set"

  system_status:
    - name: Slot1Running
      start_bit: 0
      length: 1
      value_source: dbc_boolean_values
    - name: Slot2Running
      start_bit: 1
      length: 1
      value_source: dbc_boolean_values
    - name: Led1On
      start_bit: 2
      length: 1
      value_source: dbc_boolean_values
    - name: Led2On
      start_bit: 3
      length: 1
      value_source: dbc_boolean_values
    - name: SummaryReserved
      start_bit: 4
      length: 4
      description: "Reserved summary bits; transmit zero"
    - name: Slot1State
      start_bit: 8
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
      description: "Raw slot 1 running state"
    - name: Slot2State
      start_bit: 16
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
      description: "Raw slot 2 running state"
    - name: Led1State
      start_bit: 24
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
      description: "Raw LED 1 output state"
    - name: Led2State
      start_bit: 32
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
      description: "Raw LED 2 output state"
    - name: Slot1Requested
      start_bit: 40
      length: 1
      value_source: dbc_boolean_values
    - name: Slot2Requested
      start_bit: 41
      length: 1
      value_source: dbc_boolean_values
    - name: Led1Requested
      start_bit: 42
      length: 1
      value_source: dbc_boolean_values
    - name: Led2Requested
      start_bit: 43
      length: 1
      value_source: dbc_boolean_values
    - name: PwmRequested
      start_bit: 44
      length: 1
      value_source: dbc_boolean_values
    - name: RequestReserved
      start_bit: 45
      length: 3
      description: "Reserved request bits; transmit zero"
    - name: SwitchDataValid
      start_bit: 48
      length: 1
      value_source: dbc_boolean_values
    - name: In0Closed
      start_bit: 49
      length: 1
      value_source: dbc_boolean_values
    - name: In1Closed
      start_bit: 50
      length: 1
      value_source: dbc_boolean_values
    - name: In2Closed
      start_bit: 51
      length: 1
      value_source: dbc_boolean_values
    - name: In3Closed
      start_bit: 52
      length: 1
      value_source: dbc_boolean_values
    - name: PhysicalReserved
      start_bit: 53
      length: 3
      description: "Reserved physical-input bits; transmit zero"
    - name: Slot1Blocked
      start_bit: 56
      length: 1
      value_source: dbc_boolean_values
    - name: Slot2Blocked
      start_bit: 57
      length: 1
      value_source: dbc_boolean_values
    - name: Led1Overridden
      start_bit: 58
      length: 1
      value_source: dbc_boolean_values
    - name: OverrideReserved3
      start_bit: 59
      length: 1
      description: "Reserved override bit; transmit zero"
    - name: PwmBlocked
      start_bit: 60
      length: 1
      value_source: dbc_boolean_values
    - name: OverrideReserved5
      start_bit: 61
      length: 3
      description: "Reserved override bits; transmit zero"

  rtc_alarm_event:
    - name: EventCode
      start_bit: 0
      length: 8
      value_source: rtc_alarm_event_codes
      description: "RTC alarm event type"
    - name: AlarmFlag
      start_bit: 8
      length: 1
      value_source: dbc_boolean_values
      description: "PCA2131 alarm flag"
    - name: InterruptEnabled
      start_bit: 9
      length: 1
      value_source: dbc_boolean_values
    - name: ConfigurationValid
      start_bit: 10
      length: 1
      value_source: dbc_boolean_values
    - name: AlarmFlagsReserved
      start_bit: 11
      length: 5
      description: "Reserved alarm flag bits; transmit zero"
    - name: Hour
      start_bit: 16
      length: 8
      maximum: 23
      unit: "h"
    - name: Minute
      start_bit: 24
      length: 8
      maximum: 59
      unit: "min"
    - name: Second
      start_bit: 32
      length: 8
      maximum: 59
      unit: "s"
    - name: Day
      start_bit: 40
      length: 8
      minimum: 1
      maximum: 31
    - name: Month
      start_bit: 48
      length: 8
      minimum: 1
      maximum: 12
    - name: Year
      start_bit: 56
      length: 8
      maximum: 99
      description: "Year offset from 2000"

  pwm_status:
    - name: Running
      start_bit: 0
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
    - name: DutyCycle
      start_bit: 8
      length: 8
      maximum: 100
      unit: "%"
    - name: ActualFrequency
      start_bit: 16
      length: 32
      unit: "Hz"
    - name: Requested
      start_bit: 48
      length: 1
      value_source: dbc_boolean_values
      description: "Remote PWM output is requested"
    - name: PhysicalPermitted
      start_bit: 49
      length: 1
      value_source: dbc_boolean_values
      description: "Physical input policy permits PWM output"
    - name: Blocked
      start_bit: 50
      length: 1
      value_source: dbc_boolean_values
    - name: SwitchDataValid
      start_bit: 51
      length: 1
      value_source: dbc_boolean_values
    - name: ControlReserved
      start_bit: 52
      length: 4
      description: "Reserved control-policy bits; transmit zero"
    - name: Reserved
      start_bit: 56
      length: 8
      description: "Reserved; transmit zero"

  input_capture_status:
    - name: SignalDetected
      start_bit: 0
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
    - name: DutyCycle
      start_bit: 8
      length: 8
      maximum: 100
      unit: "%"
    - name: Frequency
      start_bit: 16
      length: 32
      unit: "Hz"
    - name: EdgeCount
      start_bit: 48
      length: 16
      description: "Saturating captured-edge count"

  pwm_self_test_status:
    - name: State
      start_bit: 0
      length: 8
      maximum: 5
      value_source: pwm_self_test_state_codes
    - name: CurrentPoint
      start_bit: 8
      length: 8
    - name: TotalPoints
      start_bit: 16
      length: 8
    - name: PassedPoints
      start_bit: 24
      length: 8
    - name: ExpectedFrequency
      start_bit: 32
      length: 32
      unit: "Hz"

  pwm_self_test_result:
    - name: Point
      start_bit: 0
      length: 8
    - name: Passed
      start_bit: 8
      length: 8
      maximum: 1
      value_source: dbc_boolean_values
    - name: ExpectedDutyCycle
      start_bit: 16
      length: 8
      maximum: 100
      unit: "%"
    - name: MeasuredDutyCycle
      start_bit: 24
      length: 8
      maximum: 100
      unit: "%"
    - name: MeasuredFrequency
      start_bit: 32
      length: 32
      unit: "Hz"

  log_response:
    - name: FragmentHeader
      start_bit: 0
      length: 8
      description: "0x70-0x72 info, 0x80-0x84 record, or 0xF0 error"
    - name: FragmentData
      start_bit: 8
      length: 56
      description: "Seven transport bytes; logical fields may cross frames"

  log_heartbeat:
    - name: ProtocolVersion
      start_bit: 0
      length: 8
    - name: Ready
      start_bit: 8
      length: 1
      value_source: dbc_boolean_values
    - name: OverwriteDetected
      start_bit: 9
      length: 1
      value_source: dbc_boolean_values
    - name: HeartbeatFlagsReserved
      start_bit: 10
      length: 6
      description: "Reserved heartbeat flag bits; transmit zero"
    - name: LatestSequence
      start_bit: 16
      length: 32
    - name: RecordCount
      start_bit: 48
      length: 8
      maximum: *log_ram_capacity
